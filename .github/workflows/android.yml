name: Lua Client Mobile Android

on:
  push:
    branches:
      - main
      - codex/lua-client-mobile-v0.1.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lua-client-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: "0.1.2"
      VERSION_TAG: "v0.1.2"
      APK_NAME: "LuaClient-Mobile-v0.1.2-arm64.apk"

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "lua-client-mobile"

      - name: Prepare CI Firebase configuration
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "lua-client-ci",
              "storage_bucket": "lua-client-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.kauan.luaclient.mobile"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyLuaClientCIOnlyPlaceholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Configure optional API keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY:-}" > local.properties

      - name: Build installable ARM64 APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"

      - name: Verify APK integrity and architecture
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "${APK_NAME}"
          unzip -l "${APK_NAME}" | grep -F "lib/arm64-v8a/libLuaClient.so"
          if unzip -l "${APK_NAME}" | grep -E "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "Unexpected non-ARM64 native libraries found."
            exit 1
          fi
          sha256sum "${APK_NAME}" | tee "${APK_NAME}.sha256"
          stat --printf='size_bytes=%s\n' "${APK_NAME}" | tee apk-metadata.txt
          {
            echo "version=${VERSION_NAME}"
            echo "min_android=9 (API 28)"
            echo "architecture=arm64-v8a"
            echo "minecraft_tested=1.26.45.1 on Android 15: v0.1.1 log confirmed gxcore crash; v0.1.2 compatibility-safe retest pending"
          } >> apk-metadata.txt
          git archive --format=zip --output "LuaClient-Mobile-v0.1.2-source.zip" HEAD

      - name: Prepare license files
        run: |
          cp LICENSE LuaClient-Mobile-Apache-2.0-LICENSE.txt
          cp NOTICE LuaClient-Mobile-NOTICE.txt
          cp THIRD_PARTY_NOTICES.md LuaClient-Mobile-THIRD-PARTY-NOTICES.md

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: LuaClient-Mobile-v0.1.2-arm64
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
            apk-metadata.txt
            LuaClient-Mobile-v0.1.2-source.zip
            LuaClient-Mobile-Apache-2.0-LICENSE.txt
            LuaClient-Mobile-NOTICE.txt
            LuaClient-Mobile-THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: "v0.1.2"
      APK_NAME: "LuaClient-Mobile-v0.1.2-arm64.apk"
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download verified build package
        uses: actions/download-artifact@v4
        with:
          name: LuaClient-Mobile-v0.1.2-arm64
          path: release-package

      - name: Create permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Release ${VERSION_TAG} already exists; it will not be replaced."
            exit 0
          fi
          python3 scripts/render_release_notes.py resources/launcher/changelog.json release-notes.md
          gh release create "${VERSION_TAG}" \
            "release-package/${APK_NAME}" \
            "release-package/${APK_NAME}.sha256" \
            release-package/apk-metadata.txt \
            release-package/LuaClient-Mobile-v0.1.2-source.zip \
            release-package/LuaClient-Mobile-Apache-2.0-LICENSE.txt \
            release-package/LuaClient-Mobile-NOTICE.txt \
            release-package/LuaClient-Mobile-THIRD-PARTY-NOTICES.md \
            --target "${GITHUB_SHA}" \
            --title "Lua Client Mobile ${VERSION_TAG}" \
            --notes-file release-notes.md
